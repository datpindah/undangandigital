<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital</title>
    <script>
        // Smart router: detect path and load correct page
        (function() {
            var path = window.location.pathname;
            if (path.startsWith('/haflah/') || path === '/haflah') {
                // Load haflah invitation page
                fetch('/haflah.html')
                    .then(function(r) { return r.text(); })
                    .then(function(html) {
                        document.open('text/html');
                        document.write(html);
                        document.close();
                    })
                    .catch(function() {
                        document.body.innerHTML = '<p style="text-align:center;padding:2rem;color:red">Halaman tidak ditemukan</p>';
                    });
            } else if (path === '/admin' || path === '/admin/') {
                window.location.replace('/admin.html');
            } else {
                // Load wedding invitation page
                fetch('/index.html')
                    .then(function(r) { return r.text(); })
                    .then(function(html) {
                        document.open('text/html');
                        document.write(html);
                        document.close();
                    })
                    .catch(function() {
                        document.body.innerHTML = '<p style="text-align:center;padding:2rem;color:red">Halaman tidak ditemukan</p>';
                    });
            }
        })();
    </script>
</head>
<body>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;">
        <p style="color:#666">Memuat...</p>
    </div>
</body>
</html>
